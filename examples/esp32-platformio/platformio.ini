; APP — ESP-32 PlatformIO Configuration
;
; Install PlatformIO: https://platformio.org/install
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; Enable PSRAM if your board has it (improves JSON handling for large Agent Cards)
; build_flags = -DBOARD_HAS_PSRAM

; Upload port — uncomment and set to your serial port
; upload_port = /dev/ttyUSB0    ; Linux
; upload_port = /dev/cu.SLAB_USBtoUART  ; macOS
; upload_port = COM3            ; Windows
